# Bloque agregado al final de /etc/ntpsec/ntp.conf (líneas "pool" originales comentadas)
# --- Farmadrogas: fuentes de hora (pool de Colombia y global) ---
server 0.co.pool.ntp.org iburst
server 1.co.pool.ntp.org iburst
server 0.south-america.pool.ntp.org iburst
pool pool.ntp.org iburst

# --- Farmadrogas: permitir que la red local consulte la hora ---
restrict 192.168.1.0 mask 255.255.255.0 nomodify notrap nopeer
